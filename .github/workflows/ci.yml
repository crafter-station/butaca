name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx @biomejs/biome@2.4.10 lint src tests --diagnostic-level=error

      - name: Typecheck
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.test.json

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify package
        run: bun pm pack --dry-run
